name: Experiment wrapper diagnosis
on:
  push:
    branches: [codex/bank-experiment-wrapper-diagnosis]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: pip install uv==0.13.5
      - name: Install exact locked dependencies
        run: uv sync --frozen --extra dev
      - name: Enable phase timing and stack samples
        run: mkdir -p .ci-diagnostics && touch .ci-diagnostics/enabled
      - name: Exercise original 90-second wrapper
        run: .venv/bin/python -m pytest tests/test_experiments.py::test_delivered_experiment_controls -q
      - name: Save credential-free diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-wrapper-${{ matrix.sample }}
          path: .ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
