name: Experiment wrapper diagnosis
on:
  push:
    branches: [codex/bank-experiment-wrapper-diagnosis]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - run: pip install uv==0.13.5
      - name: Install exact locked dependencies
        run: uv sync --frozen --extra dev
      - name: Enable phase timing and stack samples
        run: mkdir -p .ci-diagnostics && touch .ci-diagnostics/enabled
      - name: Exercise original encoding with original 90-second wrapper
        continue-on-error: true
        run: |
          git show fa58ab0837a8af643b838226e1f1764b4bf2b7d5:src/synth/companion/experiments.py > src/synth/companion/experiments.py
          .venv/bin/python -m pytest tests/test_experiments.py::test_delivered_experiment_controls -q
      - name: Preserve baseline evidence and restore candidate
        if: always()
        run: |
          mv .ci-diagnostics .ci-baseline
          mkdir .ci-diagnostics
          touch .ci-diagnostics/enabled
          git restore src/synth/companion/experiments.py
      - name: Exercise candidate encoding with original 90-second wrapper
        if: always()
        run: .venv/bin/python -m pytest tests/test_experiments.py::test_delivered_experiment_controls -q
      - name: Save credential-free diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-wrapper-${{ matrix.sample }}
          path: |
            .ci-diagnostics/
            .ci-baseline/
          include-hidden-files: true
          if-no-files-found: error
