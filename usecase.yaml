schema_version: 1
slug: northwind-bank-assistant
name: Northwind Bank Assistant
tagline: Inspect bilingual banking actions, regressions and conduct evidence.
story: 'Compare frozen banking actions, dispute and retrieval-cost regressions, and
  conduct policy cases in Langfuse, then use the bilingual live assistant. Further
  interactive capabilities are tracked by Depot spec #365.'
target:
  project_hint: demo
  supports:
  - cloud_eu
  - cloud_us
  - self_hosted
base_config:
  default: config/demo.yaml
config_schema:
  type: object
  properties:
    runtime.n8n_enabled:
      type: boolean
      default: false
      title: Complaint workflow
      description: Start private n8n with this instance. Each complaint runs two model calls. Local history resets when it stops.
    runtime.apm_enabled:
      type: boolean
      default: false
      title: APM
      description: Start a private Jaeger view with this live instance. Trace data resets when it stops.
    generation.seed:
      type: integer
      default: 42
      minimum: 0
      maximum: 2147483647
      title: Generation seed
      description: Deterministic RNG seed for the whole dataset. Vary it to mint a
        distinct trace/id set per deployment; the same seed always materializes the
        same Spool, but re-seeding a project that already holds it appends a second
        copy (the v4 write path has no upsert).
    generation.target_traces:
      type: integer
      minimum: 58
      maximum: 256
      default: 64
      title: Turn traces
      description: Includes 58 mandatory banking turns. Additional traces add background
        conversations without removing required cases.
    generation.history_days:
      type: integer
      enum: [1, 2, 7, 30, 90]
      default: 7
      title: History window (days)
      description: Inclusive UTC history window ending on the selected run date.
  required: []
setup:
  version: 1
  fields:
    runtime.n8n_enabled: {group: scenario}
    runtime.apm_enabled: {group: scenario}
    generation.target_traces: {group: volume}
    generation.history_days: {group: volume}
    generation.seed: {group: advanced}
  schedule:
    timezone: UTC
    end: inclusive
    history: {field: generation.history_days}
  presets:
    quick_rehearsal:
      label: Quick rehearsal
      values:
        generation.target_traces: 58
  host_defaults:
    cloud_eu: {generation.target_traces: 64}
    cloud_us: {generation.target_traces: 64}
    self_hosted: {generation.target_traces: 64}
pipeline:
- id: probe
  run: synth probe --config {config}
  fatal: true
- id: plan
  run: synth plan --config {config}
  gate: confirm
  parse:
    plan_counts: regex:PLAN_COUNTS=(\{[^\n]+\})
- id: prompts
  run: synth setup-assets --config {config}
  fatal: true
  timeout_minutes: 5
- id: seed
  run: synth seed --config {config}
  generate: synth generate-spool --config {config}
  resumable: synth import-spool --config {config}
  timeout_minutes: 10
- id: cohorts
  run: synth prepare-cohorts --config {config}
  fatal: true
  timeout_minutes: 10
- id: verify
  run: synth verify --config {config}
  fatal: true
artifacts:
- path: DEMO_SCRIPT.md
  render: markdown
  title: Presenter Runbook
assets:
  docs:
  - path: docs/DEPOT_KIT.md
    title: Overview
teardown:
  note: Depot removes local containers and state. Seeded Langfuse observations remain.
    Use a fresh disposable project or an explicitly authorised project reset before
    importing again.
llm:
  providers:
  - anthropic
  - openai
live_components:
- name: companion
  description: Bilingual banking assistant with retrieval, guardrails, confirmed
    banking actions, participant reset, answer feedback, protected policy judges, model-free conduct reconciliation and optional private APM. Voice
    and advanced workshop capabilities remain unavailable in this candidate.
  command: synth companion --config {config} --host 0.0.0.0 --port 8080
  port: 8080
  requires_secrets:
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_SECRET_KEY
  - LLM_API_KEY
  health_path: /api/health
  protected_paths:
  - path: /manage/judges
    access: manage
  - path: /manage/reviews
    access: manage
  - path: /apm
    access: presenter
  - path: /n8n
    access: presenter
  routes:
  - path: /
    title: Northwind Bank
