[project]
name = "northwind-bank-assistant"
version = "0.7.2"
description = "Demo Depot synth kit — fork-based Northwind banking kit."
requires-python = ">=3.12,<3.13"
dependencies = [
    # The shared synthesis library (public git dependency). Pinned to an immutable commit — never a
    # moving branch — so this kit's vendor-approved output can't be silently rewritten by a
    # later lib change. Bump deliberately (see the lib's RELEASING.md).
    "langfuse-synth-core[companion] @ git+https://github.com/borismichel/langfuse-synth-core@v5.1.0",
    "langfuse==5.0.4",
    "PyYAML>=6,<7",
    "requests>=2.31",
    "packaging>=24",
    "langgraph>=1,<2",
    "langchain-core>=1,<2",
    "langchain-anthropic>=1,<2",
    "langchain-openai>=1,<2",
    "mcp>=1.12,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "playwright==1.64.1",
    # The determinism golden gate + `synth-authoring validate/freeze` ride the [authoring]
    # extra. SAME ref as the runtime pin above — the gate and the core the kit runs against
    # must be the one, identical build. Bump both pins together, never let them drift.
    "langfuse-synth-core[authoring] @ git+https://github.com/borismichel/langfuse-synth-core@v5.1.0",
]

[project.scripts]
synth = "synth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "demos/bank-assistant"]
include = ["synth*", "northwind*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "demos/bank-assistant"]
testpaths = ["tests"]

[tool.setuptools.package-data]
synth = ["history.json", "assets.json"]
