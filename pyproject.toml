[project]
name = "northwind-bank-assistant"
version = "0.1.0"
description = "Demo Depot synth kit — fork-based Northwind banking kit."
requires-python = ">=3.12,<3.13"
dependencies = [
    # The shared synthesis library (public git dependency). Pinned to a TAG — never a
    # moving branch — so this kit's vendor-approved output can't be silently rewritten by a
    # later lib change. Bump deliberately (see the lib's RELEASING.md).
    "langfuse-synth-core @ git+https://github.com/borismichel/langfuse-synth-core@bb2cf441acce20b19482d69d2f7173cb46845772",
    "langfuse==5.0.4",
    "PyYAML>=6,<7",
    "requests>=2.31",
    "packaging>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    # The determinism golden gate + `synth-authoring validate/freeze` ride the [authoring]
    # extra. SAME ref as the runtime pin above — the gate and the core the kit runs against
    # must be the one, identical build. Bump both pins together, never let them drift.
    "langfuse-synth-core[authoring] @ git+https://github.com/borismichel/langfuse-synth-core@bb2cf441acce20b19482d69d2f7173cb46845772",
]

[project.scripts]
synth = "synth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
